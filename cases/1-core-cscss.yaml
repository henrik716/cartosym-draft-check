# How CartoSym-CSS values are read, checked on the CartoSym-JSON each implementation writes for them
# (`cs-canif convert`, pycartosym's Converter). The draft renderer reads CartoSym-CSS with pycartosym, so it has
# no column of its own here.
#
# Issue #173, point 2 (agreed by Jérôme and Maxime, Nov 22-23): in `position: 10 -4` the `-` is attached to
# the 4, so the value is the point (10, -4), not the subtraction 10 - 4. Jérôme was to check what libCartoSym
# does; this case checks it in CI, on libCartoSym main. `10 4` is the control. The schema allows a point as
# `[x, y]` or `{x, y}`; the harness treats both as the same point.
- {id: cscss-tuple-negative, requirement: /req/cscss/expressions, kind: style, format: cscss,
   input: "Huts { marker: { elements: [ Dot { position: 10 -4; size: 6 } ] }; }\n",
   csjson: {at: /stylingRules/0/symbolizer/marker/elements/0/position, expect: {x: 10, y: -4}}, expect: "{x: 10, y: -4}",
   note: "A `-` directly before a number starts a new value (#173)."}
- {id: cscss-tuple, requirement: /req/cscss/expressions, kind: style, format: cscss,
   input: "Huts { marker: { elements: [ Dot { position: 10 4; size: 6 } ] }; }\n",
   csjson: {at: /stylingRules/0/symbolizer/marker/elements/0/position, expect: {x: 10, y: 4}}, expect: "{x: 10, y: 4}"}
#
# Issue #100 (agreed Nov 18-19): a Font `size` without a unit is in pixels, like every other length, and the
# examples write `pt`. The font-size PR makes the schema's Font `size` a unitValue, so `12 pt` is `{"pt": 12}` in
# CartoSym-JSON. The plain number is the control.
- {id: cscss-font-size-pt, requirement: /req/vector/fonts, kind: style, format: cscss,
   input: "Huts { marker: { elements: [ Text { text: 'a', font: { size: 12 pt } } ] }; }\n",
   csjson: {at: /stylingRules/0/symbolizer/marker/elements/0/font/size, expect: {pt: 12}}, expect: "{pt: 12}",
   note: "A font size with a unit keeps it (#100)."}
- {id: cscss-font-size, requirement: /req/vector/fonts, kind: style, format: cscss,
   input: "Huts { marker: { elements: [ Text { text: 'a', font: { size: 12 } } ] }; }\n",
   csjson: {at: /stylingRules/0/symbolizer/marker/elements/0/font/size, expect: 12}, expect: "12"}
#
# Issue #100 (agreed Nov 18-19), font inheritance PR: a `font` on the Symbolizer and on a MultiGraphic (here the
# marker), whose properties the Text graphics take where they don't set them (/req/vector/font-inheritance).
- {id: cscss-font-symbolizer, requirement: /req/vector/font-inheritance, kind: style, format: cscss,
   input: "Huts { font: { face: 'Arial', size: 10 pt }; marker: { elements: [ Text { text: 'a' } ] }; }\n",
   csjson: {at: /stylingRules/0/symbolizer/font/size, expect: {pt: 10}}, expect: "{pt: 10}",
   note: "A `font` on the Symbolizer (#100)."}
- {id: cscss-font-multigraphic, requirement: /req/vector/font-inheritance, kind: style, format: cscss,
   input: "Huts { marker: { font: { size: 14 pt }, elements: [ Text { text: 'a' } ] }; }\n",
   csjson: {at: /stylingRules/0/symbolizer/marker/font/size, expect: {pt: 14}}, expect: "{pt: 14}",
   note: "A `font` on a MultiGraphic (#100)."}
