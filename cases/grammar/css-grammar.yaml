# Inputs for tools/check_grammar.py, which runs them through a parser generated
# from the spec's CartoSym-CSS grammar. In a subfolder because harness/run.py
# reads cases/*.yaml.
#
# selector: the text between [ and ], in the style `[...] { opacity: 0.5; }`
# style:    a complete style sheet
# expect:   "accepted", "rejected", or for a selector the expected parse, with
#           brackets around each operation
# rule:     optional; the parse tree must have this rule applied to the input
#           that follows, e.g. "expCall random" for a call of random (the
#           expected parse leaves out rule names)

# --- notEqual (issue #119, PR #124) -----------------------------------------
- {selector: "a <> 1", expect: "(a <> 1)"}
- {selector: "a<>1", expect: "(a <> 1)"}
- {selector: "a <> 'x'", expect: "(a <> 'x')"}
- {selector: "a <> b", expect: "(a <> b)"}
- {selector: "a + 1 <> 2", expect: "((a + 1) <> 2)"}
- {selector: "not a <> 1", expect: "(not (a <> 1))"}
- {selector: "(a <> 1) and (b <> 2)", expect: "((( (a <> 1) )) and (( (b <> 2) )))"}
- {style: "{ opacity: a <> 1 ? 1 : 0; }\n", expect: accepted}
- {style: "@v = 1 <> 2;\n{ opacity: 1; }\n", expect: accepted}

# --- Must keep working ------------------------------------------------------
- {selector: "a = 1", expect: "(a = 1)"}
- {selector: "a < 1", expect: "(a < 1)"}
- {selector: "a > 1", expect: "(a > 1)"}
- {selector: "a <= 1", expect: "(a <= 1)"}
- {selector: "a >= 1", expect: "(a >= 1)"}
- {selector: "name = '<>'", expect: "(name = '<>')"}

# --- Must stay errors -------------------------------------------------------
- {selector: "a < > 1", expect: rejected}
- {selector: "a >< 1", expect: rejected}
- {selector: "a != 1", expect: rejected}
- {selector: "a <>", expect: rejected}
- {selector: "<> 1", expect: rejected}
- {selector: "a <> <> 1", expect: rejected}

# --- Operator priority (issue #118, PR #123) --------------------------------
- {selector: "viz.sd > 20000 and viz.sd < 200000", expect: "(((viz . sd) > 20000) and ((viz . sd) < 200000))"}
- {selector: "a = 1 and b = 2", expect: "((a = 1) and (b = 2))"}
- {selector: "a <> 1 and b <> 2", expect: "((a <> 1) and (b <> 2))"}
- {selector: "a <> 1 or b <> 2 and c <> 3", expect: "((a <> 1) or ((b <> 2) and (c <> 3)))"}
- {selector: "not a <> 1 and b <> 2", expect: "((not (a <> 1)) and (b <> 2))"}
- {selector: "a between 1 and 5 and b <> 2", expect: "((a between 1 and 5) and (b <> 2))",
   note: "PR #123 lists this as a remaining limitation."}

# --- Calls without arguments (issue #173) ------------------------------------
# On main, random() parses, but as an empty expInstance (like `Dot { }`), not as a call;
# spec PR #196 (arguments? in expCall) makes it a call.
- {selector: "random() < 0.5", expect: "((random ( )) < 0.5)", rule: "expCall random"}
- {selector: "random ( ) < 0.5", expect: "((random ( )) < 0.5)", rule: "expCall random"}
- {style: "{ opacity: random(); }\n", expect: accepted, rule: "expCall random"}
- {style: "@r = random();\n{ opacity: @r; }\n", expect: accepted, rule: "expCall random"}
- {selector: "random(,) < 1", expect: rejected}
- {selector: "max(1,) = 1", expect: rejected}
- {selector: "max(, 1) = 1", expect: rejected}
# Must keep working: calls with arguments, and instances with named members.
- {selector: "max(1, 2) = 2", expect: "((max ( (1 , 2) )) = 2)", rule: "expCall max"}
- {selector: "abs(x) = 1", expect: "((abs ( x )) = 1)", rule: "expCall abs"}
- {style: "{ opacity: INTERVAL(start: '2021-01-01T00:00:00Z'; end: '2021-12-31T23:59:59Z') = x ? 1 : 0; }\n", expect: accepted, rule: "expInstance INTERVAL"}
- {style: "{ marker: { elements: [ Dot { size: 5 } ] }; }\n", expect: accepted, rule: "expInstance Dot"}

# --- A '-' directly before a number (issue #173, point 2) ---------------------
# After whitespace, `-4` is a negative number, so `10 -4` is the tuple (10, -4); with a space after the '-',
# or none before it, it is a subtraction. The token includes the whitespace before the '-', hence the two
# spaces in the expected parse. On main all of these are subtractions.
- {selector: "a = 10 -4", expect: "(a = (10  -4))", rule: "tuple"}
- {style: "{ marker: { elements: [ Dot { position: 10 -4 } ] }; }\n", expect: accepted, rule: "tuple"}
- {style: "{ marker: { elements: [ Dot { position: 10 px -4 px } ] }; }\n", expect: accepted, rule: "tuple"}
- {selector: "a = 10 - 4", expect: "(a = (10 - 4))"}
- {selector: "a = 10-4", expect: "(a = (10 - 4))"}
- {selector: "a = 10 -x", expect: "(a = (10 - x))", note: "Only a number after the '-' makes it a sign."}
- {selector: "a = (-4)", expect: "(a = (( (- 4) )))", note: "No whitespace before the '-': a unary minus."}
- {selector: "a = -4", expect: "(a =  -4)"}
