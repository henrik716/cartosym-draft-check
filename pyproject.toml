[project]
name = "cartosym-draft-check"
version = "0.1.0"
description = "Draft renderer, test harness, render gallery and document figures for checking the OGC CartoSym 2.0 Part 1 requirements (opengeospatial/cartographic-symbology)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cartosym==0.0.1",  # libCartoSym (Ecere), for the test harness
    "ecrt==0.0.6",
    "pycartosym[all]==0.6.4",  # CSCSS conversion and CQL2-Text parsing
    "pyyaml>=6.0",
    "jsonschema>=4.18",  # the gallery validates its styles against the PR's schema
    "resvg-py==0.5.0",  # SVG to PNG for the figures of the specification (doc_examples)
    "pillow>=11.0",  # font metrics for label sizes
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartosym_draft"]
